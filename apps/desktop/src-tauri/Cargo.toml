[package]
name = "lockbox-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
core-foundation = "0.10.1"
lockbox-core = { version = "0.1.0", path = "../../../crates/core" }
lockbox-platform = { version = "0.1.0", path = "../../../crates/platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2.4.0"
uuid = "1.26.1"
zeroize = "1.9.0"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

<!doctype html><html><head><meta charset="utf-8"><title>Sign up</title></head>
<body style="font-family:system-ui;padding:40px"><h1>Create an account</h1>
<form id="f"><p><input id="email" type="email" autocomplete="username" placeholder="Email"></p>
<p><input id="pw1" type="password" autocomplete="new-password" placeholder="Password"></p>
<p><input id="pw2" type="password" autocomplete="new-password" placeholder="Repeat password"></p>
<p><button id="go">Sign up</button></p></form>
<script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();setTimeout(()=>location.href='/welcome.html',50)}</script></body></html>

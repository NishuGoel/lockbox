<!doctype html><html><head><meta charset="utf-8"><title>Sign in · Northwind Mail</title><link rel="stylesheet" href="style.css"></head>
<body><header><i style="background:#0ea5e9"></i>Northwind Mail</header><main><div class="card">
<h1>Sign in</h1><p>Use your passkey: no password needed.</p>
<button id="login">Sign in with a passkey</button><button class="ghost" id="reg">Create a passkey</button></div></main>
<script>
const rnd=()=>crypto.getRandomValues(new Uint8Array(32));
document.getElementById('reg').onclick=()=>navigator.credentials.create({publicKey:{rp:{id:'northwind.localhost',name:'Northwind Mail'},user:{id:new TextEncoder().encode('u-1'),name:'alex@northwind.example',displayName:'Alex'},challenge:rnd(),pubKeyCredParams:[{type:'public-key',alg:-7}],authenticatorSelection:{residentKey:'required'}}}).then(()=>document.querySelector('p').textContent='Passkey created.');
document.getElementById('login').onclick=()=>navigator.credentials.get({publicKey:{rpId:'northwind.localhost',challenge:rnd()}}).then(()=>location.href='welcome.html');
</script></body></html>

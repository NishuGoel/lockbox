<!doctype html><html><head><meta charset="utf-8"><title>Sign in · Acme Cloud</title><link rel="stylesheet" href="style.css"></head>
<body><header><i></i>Acme Cloud</header><main><form class="card" id="f">
<h1>Welcome back</h1><p>Sign in to your Acme Cloud workspace.</p>
<label for="email">Email</label><input id="email" type="email" autocomplete="username">

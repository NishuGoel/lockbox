[package]
name = "lockbox-core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
totp-rs = { version = "6.0.0", features = ["otpauth"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.0"

[dev-dependencies]
hex = "0.4.3"

[package]
name = "lockbox-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
lockbox-core = { version = "0.1.0", path = "../core" }
lockbox-platform = { version = "0.1.0", path = "../platform" }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = "1.26.1"
zeroize = "1.9.0"

[[bin]]
name = "lockbox"
path = "src/main.rs"

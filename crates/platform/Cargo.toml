[package]
name = "lockbox-platform"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
libc = "0.2.189"
lockbox-core = { version = "0.1.0", path = "../core" }
p256 = { version = "0.14.0", features = ["ecdsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
uuid = "1.26.1"
zeroize = "1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard"] }
objc2-foundation = "0.3.2"
security-framework = "3.7.0"

[dev-dependencies]
ciborium = "0.2.2"
